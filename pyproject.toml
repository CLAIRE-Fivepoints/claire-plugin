[project]
name = "claire-fivepoints"
version = "0.1.0"
description = "Fivepoints plugin for Claire V2 — registers fivepoints.tfone.* workflows"
requires-python = ">=3.12"
dependencies = [
    "claire-core",
    "claire-adapters",
    "claire-workflows",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "requests>=2.31",
    "typer>=0.9",
]

[tool.uv.sources]
claire-core = { git = "https://github.com/claire-labs/claire.git", subdirectory = "packages/core" }
claire-adapters = { git = "https://github.com/claire-labs/claire.git", subdirectory = "packages/adapters" }
claire-workflows = { git = "https://github.com/claire-labs/claire.git", subdirectory = "packages/workflows" }

[project.scripts]
fivepoints = "claire_fivepoints.cli:app"

[project.entry-points."claire.plugins"]
fivepoints = "claire_fivepoints:plugin_info"

[project.entry-points."claire.workflows"]
"fivepoints.tfone.github" = "claire_fivepoints.workflows:run_fivepoints_tfone_github_for_issue"
"fivepoints.tfone.full" = "claire_fivepoints.workflows:run_fivepoints_tfone_full_for_issue"
"fivepoints.tfone.dev" = "claire_fivepoints.workflows:run_fivepoints_tfone_dev_for_issue"
"fivepoints.tfone.dev.noreview" = "claire_fivepoints.workflows:run_fivepoints_tfone_dev_noreview_for_issue"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/claire_fivepoints", "domain/scripts/azure_issue_bridge"]

[tool.pytest.ini_options]
pythonpath = ["src", "domain/scripts"]
